{% extends "zehava/auth.html" %}

{% block title %}TimeFlow · {{ t.mail_unsubscribe }}{% endblock %}

{% block card %}
<h1 id="auth-title">{{ t.unsubscribe_q }}</h1>
<form class="login-form" action="{{ url_for('zehava.unsubscribe', token=token) }}" method="post">
  {{ csrf() }}
  <button type="submit" class="btn btn-primary">{{ t.unsubscribe_button }}</button>
</form>
{% endblock %}
