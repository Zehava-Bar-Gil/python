{% extends "zehava/auth.html" %}

{% block title %}TimeFlow · {{ t.reset_title }}{% endblock %}

{% block card %}
<h1 id="auth-title">{{ t.reset_title }}</h1>
{% if errors %}
<ul class="form-error" role="alert">{% for key in errors %}<li>{{ t[key] }}</li>{% endfor %}</ul>
{% endif %}
<form class="login-form" action="{{ url_for('zehava.reset', token=token) }}" method="post" novalidate>
  {{ csrf() }}
  <label for="password">{{ t.new_password }}</label>
  {{ new_password(autofocus=true) }}
  <button type="submit" class="btn btn-primary">{{ t.reset_button }}</button>
</form>
{% endblock %}
